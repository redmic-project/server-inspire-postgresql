services:
  postgresql:
    image: ${IMAGE_NAME:-registry.gitlab.com/redmic-project/postgres/postgresql-postgis-pgcron-pgpartman}:${IMAGE_TAG:-latest}
    command: >
      -c checkpoint_timeout=${CHECKPOINT_TIMEOUT}
      -c cron.database_name=${POSTGRES_DB}
      -c work_mem=${WORK_MEM}
      -c max_wal_size=${MAX_WAL_SIZE}
    environment:
      POSTGRES_DB:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
      PGDATA:
    networks:
      gis-net:
        aliases:
          - ${NETWORK_ALIAS}
      postgres-net:
        aliases:
          - ${NETWORK_ALIAS}
    volumes:
      - data-vol:/var/lib/postgresql/data
    deploy:
      mode: replicated
      replicas: ${REPLICAS:-1}
      restart_policy:
        delay: ${RESTART_DELAY:-10s}
      update_config:
        delay: ${UPDATE_DELAY:-1m}
      resources:
        limits:
          cpus: '${RESOURCES_LIMITS_CPUS:-2}'
          memory: ${RESOURCES_LIMITS_MEMORY:-1G}
        reservations:
          cpus: '${RESOURCES_RESERVATIONS_CPUS:-0.001}'
          memory: ${RESOURCES_RESERVATIONS_MEMORY:-256M}

networks:
  gis-net:
    name: ${GIS_NET_NAME:-gis-net}
    driver: ${GIS_NET_DRIVER:-overlay}
    external: true

  postgres-net:
    name: ${POSTGRES_NET_NAME:-postgres-net}
    driver: ${POSTGRES_NET_DRIVER:-overlay}
    external: true
